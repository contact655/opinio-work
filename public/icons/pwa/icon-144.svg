<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5FD9"/>
      <stop offset="100%" stop-color="#2040B0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  <!-- Accent circle -->
  <circle cx="72" cy="72" r="46" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>
  <!-- Letter O -->
  <text
    x="72" y="72"
    font-family="'Inter', 'Noto Sans JP', sans-serif"
    font-weight="800"
    font-size="75"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-1"
  >O</text>
</svg>