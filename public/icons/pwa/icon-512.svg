<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5FD9"/>
      <stop offset="100%" stop-color="#2040B0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  <!-- Accent circle -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#accent)" stroke-width="20" opacity="0.6"/>
  <!-- Letter O -->
  <text
    x="256" y="256"
    font-family="'Inter', 'Noto Sans JP', sans-serif"
    font-weight="800"
    font-size="266"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-5"
  >O</text>
</svg>