<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5FD9"/>
      <stop offset="100%" stop-color="#2040B0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="152" height="152" rx="33" fill="url(#bg)"/>
  <!-- Accent circle -->
  <circle cx="76" cy="76" r="49" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>
  <!-- Letter O -->
  <text
    x="76" y="76"
    font-family="'Inter', 'Noto Sans JP', sans-serif"
    font-weight="800"
    font-size="79"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
