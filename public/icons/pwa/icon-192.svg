<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5FD9"/>
      <stop offset="100%" stop-color="#2040B0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <!-- Accent circle -->
  <circle cx="96" cy="96" r="61" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.6"/>
  <!-- Letter O -->
  <text
    x="96" y="96"
    font-family="'Inter', 'Noto Sans JP', sans-serif"
    font-weight="800"
    font-size="100"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-2"
  >O</text>
</svg>