<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5FD9"/>
      <stop offset="100%" stop-color="#2040B0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="96" height="96" rx="21" fill="url(#bg)"/>
  <!-- Accent circle -->
  <circle cx="48" cy="48" r="31" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
  <!-- Letter O -->
  <text
    x="48" y="48"
    font-family="'Inter', 'Noto Sans JP', sans-serif"
    font-weight="800"
    font-size="50"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-1"
  >O</text>
</svg>