<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5FD9"/>
      <stop offset="100%" stop-color="#2040B0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="384" height="384" rx="84" fill="url(#bg)"/>
  <!-- Accent circle -->
  <circle cx="192" cy="192" r="123" fill="none" stroke="url(#accent)" stroke-width="15" opacity="0.6"/>
  <!-- Letter O -->
  <text
    x="192" y="192"
    font-family="'Inter', 'Noto Sans JP', sans-serif"
    font-weight="800"
    font-size="200"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-4"
  >O</text>
</svg>