<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPINIO PWA アイコン — Speech Bubble</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    background: #0f172a; color: #e2e8f0;
    padding: 40px 28px; min-height: 100vh;
  }
  h1 { font-size: 22px; font-weight: 800; color: white; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 40px; line-height: 1.7; }
  .designs { display: flex; flex-wrap: wrap; gap: 28px; }
  .design-card {
    background: #1e293b; border: 2px solid #334155;
    border-radius: 20px; padding: 24px; width: 260px;
    transition: border-color 0.2s, transform 0.15s;
  }
  .design-card.featured { border-color: #3b5fd9; background: #1a2744; }
  .design-card:hover { border-color: #5b7ff5; transform: translateY(-3px); }
  .design-name { font-size: 17px; font-weight: 700; color: white; margin-bottom: 3px; }
  .design-desc { font-size: 12px; color: #64748b; margin-bottom: 16px; line-height: 1.6; }
  .preview-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .preview-row canvas { display: block; }
  .maskable-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .mask-label { font-size: 10px; color: #475569; }
  .download-btn {
    display: block; width: 100%; padding: 12px;
    background: #3b5fd9; color: white;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }
  .download-btn:hover { background: #2040b0; transform: scale(1.01); }
  .download-btn:disabled { background: #334155; color: #64748b; transform: none; cursor: default; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 6px; margin-bottom: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .tag.pick { background: #3b5fd9; color: white; }
  .tag.var  { background: #334155; color: #94a3b8; }
</style>
</head>
<body>

<h1>OPINIO アイコン — Speech Bubble</h1>
<p class="subtitle">
  「対話・意見」を表すスピーチバブルデザイン 3 案<br>
  気に入ったものの「📥 ダウンロード」→ PNG を <code style="background:#1e293b;padding:2px 6px;border-radius:4px;font-size:11px">public/icons/pwa/</code> へ移動
</p>

<div class="designs" id="designs"></div>

<script>
const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];
const MASKABLE_SIZES = [192, 512];

const DESIGNS = [
  // ① Classic Speech Bubble
  {
    id: 'bubble-classic',
    name: 'Classic',
    featured: true,
    tag: { label: '✓ 選択中', cls: 'pick' },
    desc: '角丸バブル＋テール。紫→青グラデ。中に「…」の3点ドット。シンプルで読み取りやすい',
    draw(ctx, s, mask) {
      bg(ctx, s, mask, '#0f172a', '#1a1040');

      const bx = s * 0.12, by = s * 0.16;
      const bw = s * 0.76, bh = s * 0.50;
      const br = s * 0.12;
      const tailH = s * 0.16, tailX = s * 0.28;

      // Shadow/glow
      ctx.save();
      ctx.shadowColor = 'rgba(79,70,229,0.45)';
      ctx.shadowBlur = s * 0.15;
      drawBubble(ctx, bx, by, bw, bh, br, tailX, tailH, '#4f46e5', '#3b5fd9');
      ctx.restore();

      // Redraw clean on top
      drawBubble(ctx, bx, by, bw, bh, br, tailX, tailH, '#4f46e5', '#3b5fd9');

      // 3 dots
      const dotY = by + bh * 0.5;
      const dotR = Math.max(2.5, s * 0.045);
      const spacing = s * 0.13;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      [-1, 0, 1].forEach(i => {
        ctx.beginPath();
        ctx.arc(s / 2 + i * spacing, dotY, dotR * (i === 0 ? 1.15 : 0.85), 0, Math.PI * 2);
        ctx.fill();
      });
    }
  },

  // ② Filled round bubble — フラットミニマル
  {
    id: 'bubble-round',
    name: 'Round',
    featured: false,
    tag: { label: 'バリエーション', cls: 'var' },
    desc: '角をより丸く、テールを短く小さく。よりフレンドリーでポップな印象。オレンジアクセント',
    draw(ctx, s, mask) {
      bg(ctx, s, mask, '#001233', '#001845');

      const cx = s / 2;
      const bw = s * 0.72, bh = s * 0.52;
      const bx = cx - bw / 2, by = s * 0.14;
      const br = bh * 0.46; // very round

      const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
      g.addColorStop(0, '#3b5fd9');
      g.addColorStop(1, '#2563eb');
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, br);
      ctx.fillStyle = g;
      ctx.fill();

      // tail — small triangle bottom-left
      ctx.beginPath();
      ctx.moveTo(s * 0.26, by + bh - 1);
      ctx.lineTo(s * 0.16, by + bh + s * 0.10);
      ctx.lineTo(s * 0.38, by + bh - 1);
      ctx.closePath();
      ctx.fillStyle = '#2563eb';
      ctx.fill();

      // warm dot highlight inside
      ctx.beginPath();
      ctx.arc(bx + bw - s * 0.13, by + s * 0.1, Math.max(2, s * 0.055), 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();

      // 3 dots
      const dotY = by + bh * 0.5;
      const dotR = Math.max(2, s * 0.042);
      ctx.fillStyle = 'white';
      [-1, 0, 1].forEach(i => {
        ctx.beginPath();
        ctx.arc(cx + i * s * 0.125, dotY, dotR * (i === 0 ? 1.1 : 0.82), 0, Math.PI * 2);
        ctx.fill();
      });
    }
  },

  // ③ Mentor — 大小2バブル
  {
    id: 'bubble-mentor',
    name: 'Mentor',
    featured: false,
    tag: { label: 'バリエーション', cls: 'var' },
    desc: '大（先輩・メンター）＋小（後輩・求職者）の2バブル。「相談・対話」を直接表現',
    draw(ctx, s, mask) {
      bg(ctx, s, mask, '#0f172a', '#0d0c29');

      // Big bubble — top-left (mentor)
      const lg = ctx.createLinearGradient(0, 0, s * 0.65, s * 0.55);
      lg.addColorStop(0, '#4f46e5');
      lg.addColorStop(1, '#3b5fd9');

      const bx1 = s * 0.07, by1 = s * 0.10, bw1 = s * 0.60, bh1 = s * 0.36, br1 = s * 0.09;
      ctx.beginPath();
      ctx.roundRect(bx1, by1, bw1, bh1, br1);
      ctx.fillStyle = lg;
      ctx.fill();
      // tail
      ctx.beginPath();
      ctx.moveTo(bx1 + bw1 * 0.6, by1 + bh1 - 1);
      ctx.lineTo(bx1 + bw1 * 0.78, by1 + bh1 + s * 0.09);
      ctx.lineTo(bx1 + bw1 * 0.42, by1 + bh1 - 1);
      ctx.closePath();
      ctx.fillStyle = '#3b5fd9';
      ctx.fill();
      // 2 lines inside big bubble
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(bx1 + s*0.08, by1 + bh1 * 0.32, bw1 * 0.72, Math.max(2, s * 0.038));
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      ctx.fillRect(bx1 + s*0.08, by1 + bh1 * 0.60, bw1 * 0.50, Math.max(2, s * 0.028));

      // Small bubble — bottom-right (mentee)
      const bx2 = s * 0.44, by2 = s * 0.55, bw2 = s * 0.48, bh2 = s * 0.27, br2 = s * 0.07;
      ctx.beginPath();
      ctx.roundRect(bx2, by2, bw2, bh2, br2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      // tail left
      ctx.beginPath();
      ctx.moveTo(bx2 + bw2 * 0.25, by2 + bh2 - 1);
      ctx.lineTo(bx2 + bw2 * 0.05, by2 + bh2 + s * 0.08);
      ctx.lineTo(bx2 + bw2 * 0.42, by2 + bh2 - 1);
      ctx.closePath();
      ctx.fillStyle = '#d97706';
      ctx.fill();
      // 3 dots in small bubble
      const dotY2 = by2 + bh2 * 0.5;
      const dotR2 = Math.max(1.5, s * 0.033);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      [bx2 + bw2*0.28, bx2 + bw2*0.5, bx2 + bw2*0.72].forEach(x => {
        ctx.beginPath(); ctx.arc(x, dotY2, dotR2, 0, Math.PI * 2); ctx.fill();
      });
    }
  },
];

// ─── Helpers ─────────────────────────────────────────────
function bg(ctx, s, mask, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  if (!mask) {
    ctx.beginPath();
    const r = s * 0.22;
    ctx.moveTo(r,0); ctx.lineTo(s-r,0); ctx.quadraticCurveTo(s,0,s,r);
    ctx.lineTo(s,s-r); ctx.quadraticCurveTo(s,s,s-r,s);
    ctx.lineTo(r,s); ctx.quadraticCurveTo(0,s,0,s-r);
    ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
  } else {
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  }
}

function drawBubble(ctx, bx, by, bw, bh, br, tailX, tailH, c1, c2) {
  const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.beginPath();
  ctx.moveTo(bx + br, by);
  ctx.lineTo(bx + bw - br, by); ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + br);
  ctx.lineTo(bx + bw, by + bh - br); ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - br, by + bh);
  ctx.lineTo(tailX + bw * 0.14, by + bh);
  ctx.lineTo(tailX, by + bh + tailH);
  ctx.lineTo(tailX - bw * 0.1, by + bh);
  ctx.lineTo(bx + br, by + bh); ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - br);
  ctx.lineTo(bx, by + br); ctx.quadraticCurveTo(bx, by, bx + br, by);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
}

function makeCanvas(size, design, maskable) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  design.draw(c.getContext('2d'), size, maskable);
  return c;
}
async function dlCanvas(canvas, name) {
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(resolve, 150);
    }, 'image/png');
  });
}
async function downloadDesign(design) {
  const btn = document.getElementById('btn-' + design.id);
  btn.disabled = true; btn.textContent = '⏳ ダウンロード中…';
  for (const size of SIZES) await dlCanvas(makeCanvas(size, design, false), `icon-${size}.png`);
  for (const size of MASKABLE_SIZES) await dlCanvas(makeCanvas(size, design, true), `icon-maskable-${size}.png`);
  btn.disabled = false; btn.textContent = '✅ 完了！';
  setTimeout(() => { btn.textContent = '📥 このデザインをダウンロード'; }, 3000);
  alert(`全サイズ（10ファイル）を保存しました！\n\n📁 public/icons/pwa/ フォルダに移動してください。`);
}

function render() {
  const container = document.getElementById('designs');
  DESIGNS.forEach(d => {
    const card = document.createElement('div');
    card.className = 'design-card' + (d.featured ? ' featured' : '');

    const tag = document.createElement('span');
    tag.className = `tag ${d.tag.cls}`; tag.textContent = d.tag.label;

    const name = document.createElement('div');
    name.className = 'design-name'; name.textContent = d.name;

    const desc = document.createElement('div');
    desc.className = 'design-desc'; desc.textContent = d.desc;

    const row = document.createElement('div');
    row.className = 'preview-row';
    [40, 60, 88, 128].forEach(size => {
      const c = makeCanvas(size, d, false);
      c.style.cssText = `width:${size}px;height:${size}px;border-radius:${Math.round(size*0.22)}px;`;
      row.appendChild(c);
    });

    const mRow = document.createElement('div');
    mRow.className = 'maskable-row';
    const ml = document.createElement('span');
    ml.className = 'mask-label'; ml.textContent = 'maskable (Android):';
    const mc = makeCanvas(48, d, true);
    mc.style.cssText = 'width:32px;height:32px;border-radius:50%;';
    mRow.appendChild(ml); mRow.appendChild(mc);

    const btn = document.createElement('button');
    btn.id = 'btn-' + d.id;
    btn.className = 'download-btn';
    btn.textContent = '📥 このデザインをダウンロード';
    btn.onclick = () => downloadDesign(d);

    card.appendChild(tag); card.appendChild(name); card.appendChild(desc);
    card.appendChild(row); card.appendChild(mRow); card.appendChild(btn);
    container.appendChild(card);
  });
}
render();
</script>
</body>
</html>
